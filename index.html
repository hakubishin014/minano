    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #EFECE6;
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 埋め込みラッパー */
    .deck-wrapper {
      width: 100%;
      max-width: 960px;
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* 上部ツールバー */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--green);
      color: #FFFFFF;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .btn-pptx { background: var(--orange); color: #FFFFFF; }
    .btn-pdf { background: #FFFFFF; color: var(--green); }
    .btn-ghost { background: rgba(255, 255, 255, 0.18); color: #FFFFFF; }

    /* スライド表示ステージ（16:9固定） */
    .stage-container {
      width: 100%;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 3.5% 4.5% 3%;

    .slide-canvas.is-cover {
      flex-direction: row;
      padding: 0;
    }
    .cover-bar {
      width: 2.5%;
      background: var(--green);
      flex-shrink: 0;
    }
    .cover-main {
      flex: 1;
      padding: 5.5% 4% 5% 4.5%;
      display: flex;
      gap: 4%;
      align-items: stretch;
    }
    .cover-left {
      flex: 1.35;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
    .cover-badge {
      display: inline-block;
      align-self: flex-start;
      background: var(--green);

      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
    }
    .cover-title {
      font-size: clamp(20px, 3.4vw, 36px);
      line-height: 1.25;
      color: var(--green);
      font-weight: 900;
      white-space: pre-line;
    }
    .cover-sub {
      background: var(--orange-light);
      border: 1.5px solid var(--orange);
      color: var(--brown);
      font-size: clamp(11px, 1.5vw, 16px);
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
    }
    .cover-meta {
      font-size: clamp(10px, 1.25vw, 13px);
      color: var(--sub);
      line-height: 1.65;
      white-space: pre-line;
    }
    .cover-right {
      flex: 0.85;
      display: flex;
    }

    /* 通常スライドヘッダー */
    .slide-header {
      margin-bottom: 2.6%;
      border-bottom: 2.5px solid var(--green);
      padding-bottom: 1.2%;

    .slide-tag {
      font-size: clamp(9px, 1.15vw, 12px);
      font-weight: 700;
      color: var(--orange);
      margin-bottom: 2px;
    }
    .slide-title {
      font-size: clamp(16px, 2.4vw, 26px);
      font-weight: 900;
      color: var(--green);
      line-height: 1.25;
    }

    /* コンテンツ領域 */
    .slide-body {
      flex: 1;
      display: flex;
      gap: 3%;
      min-height: 0;
    }

    .card {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.8% 2.2%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-head {
      color: #FFFFFF;
      font-size: clamp(11px, 1.45vw, 15px);
      font-weight: 700;
      text-align: center;
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 3.5%;
      flex-shrink: 0;

    .card-head.green { background: var(--green); }
    .card-head.orange { background: var(--orange); }
    .card-head.brown { background: var(--brown); }

    .card-text {
      font-size: clamp(10px, 1.32vw, 14px);
      line-height: 1.55;
      white-space: pre-line;
      color: var(--text);
    }

    /* 右画像レイアウト */
    .body-left { flex: 1.35; }
    .body-right { flex: 0.9; display: flex; }

    .img-box {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      border: 2px dashed var(--green);
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 14px;
      color: var(--green);
      font-weight: 700;
      font-size: clamp(10px, 1.3vw, 14px);
      line-height: 1.5;
      white-space: pre-line;
      overflow: hidden;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .img-box.has-img {
      border-style: solid;
      border-color: var(--border);
      background: #FFFFFF;
      padding: 6px;
    }

    /* エンディングレイアウト */
    .ending-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3%;
    }
    .vision-card {
      background: var(--card);
      border: 2px solid var(--orange);
      border-radius: 12px;
      padding: 2.5% 4%;
      text-align: center;
    }
    .vision-title {
      color: var(--orange);
      font-size: clamp(13px, 1.8vw, 20px);
      font-weight: 900;
      margin-bottom: 8px;
    }
    .vision-body {
      font-size: clamp(11px, 1.4vw, 15px);
      line-height: 1.6;
      white-space: pre-line;
    }
    .closing-band {
      background: var(--green);
      color: #FFFFFF;
      border-radius: 12px;
      padding: 2.5% 4%;
      text-align: center;
      font-size: clamp(12px, 1.65vw, 18px);
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
    }
    .thanks-text {
      text-align: center;
      color: var(--brown);
      font-size: clamp(14px, 2vw, 22px);
      font-weight: 900;
    }

    /* フッター */
    .slide-footer {
      margin-top: 2%;
      display: flex;
      justify-content: space-between;
      font-size: clamp(8px, 1vw, 11px);
      color: var(--sub);
    }

    /* 下部ナビゲーション */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #F7F5F0;
      border-top: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-nav {
      background: #FFFFFF;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-indicator {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      min-width: 72px;
      text-align: center;
    }

    /* スピーカーノート欄 */
    .notes-panel {
      padding: 14px 20px;
      background: #FFFDF8;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text);
    }
    .notes-panel.hidden { display: none; }
    .notes-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 4px;
    }

    /* 印刷（PDF保存）専用エリア */
    #print-area { display: none; }

    @media print {
      @page { size: landscape; margin: 0; }
      body { background: #FFFFFF; padding: 0; }
      .deck-wrapper { display: none !important; }
      #print-area { display: block !important; width: 100%; }
      #print-area .slide-canvas {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        page-break-after: always;
        break-after: page;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>

      {

        closing: '「木」×「食」×「安全」×「マニアックな面白さ」\n〜のんびり、わくわく、みんなの居場所。〜 を一緒に作りましょう！',
        thanks: 'ご清聴ありがとうございました',
        notes: '最後に、私たちが描くさらに先の未来です。このパークをきっかけに皆野の魅力が広がれば、将来的には皆野の名物である「雲海につながるロープウェイ」のような大きな夢にもつながっていくかもしれません。自然のぬくもりとユーモアがあふれる「みんなの居場所」を実現できるよう、これからも企画を磨いていきます。ご清聴ありがとうございました。（目安：50秒）'

    let currentIdx = 0;

    // 1枚のスライドHTMLを生成
    function buildSlideHTML(data, index) {
      const pageNum = index + 1;
      const total = SLIDES.length;
      const imgSrc = data.imageKey ? IMAGES[data.imageKey] : '';
      const imgHTML = imgSrc
        ? `<div class="img-box has-img"><img src="${imgSrc}" alt=""></div>`
        : `<div class="img-box">${escapeHTML(data.placeholder || '')}</div>`;

      if (data.type === 'cover') {
        return `
          <div class="cover-bar"></div>
          <div class="cover-main">
            <div class="cover-left">
              <span class="cover-badge">${escapeHTML(data.badge)}</span>
              <h1 class="cover-title">${escapeHTML(data.title)}</h1>
              <div class="cover-sub">${escapeHTML(data.subtitle)}</div>
              <div class="cover-meta">${escapeHTML(data.meta)}</div>
            </div>
            <div class="cover-right">${imgHTML}</div>
          </div>
        `;
      }

      const header = `
        <div class="slide-header">
          <div class="slide-tag">${escapeHTML(data.tag)}</div>
          <h2 class="slide-title">${escapeHTML(data.title)}</h2>
        </div>
      `;
      const footer = `
        <div class="slide-footer">
          <span>皆野教育シンポジウム 1班｜里山わくわくパーク in Mahora稲穂山</span>
          <strong>${pageNum} / ${total}</strong>
        </div>
      `;

      if (data.type === 'twoCard') {
        return `
          ${header}
          <div class="slide-body">
            <div class="card">
              <div class="card-head ${data.leftColor}">${escapeHTML(data.leftTitle)}</div>
              <div class="card-text">${escapeHTML(data.leftBody)}</div>
            </div>
            <div class="card">
              <div class="card-head ${data.rightColor}">${escapeHTML(data.rightTitle)}</div>
              <div class="card-text">${escapeHTML(data.rightBody)}</div>
            </div>
          </div>
          ${footer}
        `;
      }

      if (data.type === 'imageRight') {
        return `
          ${header}
          <div class="slide-body">
            <div class="card body-left">
              <div class="card-text">${escapeHTML(data.body)}</div>
            </div>
            <div class="body-right">${imgHTML}</div>
          </div>
          ${footer}
        `;
      }

      if (data.type === 'ending') {
        return `
          ${header}
          <div class="ending-wrap">
            <div class="vision-card">
              <div class="vision-title">${escapeHTML(data.visionTitle)}</div>
              <div class="vision-body">${escapeHTML(data.visionBody)}</div>
            </div>
            <div class="closing-band">${escapeHTML(data.closing)}</div>
            <div class="thanks-text">${escapeHTML(data.thanks)}</div>
          </div>
          ${footer}
        `;
      }
      return '';
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 現在のスライドを描画
    function render() {
      const stage = document.getElementById('stage');
      const data = SLIDES[currentIdx];
      stage.className = 'slide-canvas' + (data.type === 'cover' ? ' is-cover' : '');
      stage.innerHTML = buildSlideHTML(data, currentIdx);

      document.getElementById('pageIndicator').textContent = `${currentIdx + 1} / ${SLIDES.length}`;
      document.getElementById('btnPrev').disabled = currentIdx === 0;
      document.getElementById('btnNext').disabled = currentIdx === SLIDES.length - 1;
      document.getElementById('notesText').textContent = data.notes || '';
    }

    // 印刷用エリアに全11枚を展開
    function buildPrintArea() {
      const area = document.getElementById('print-area');
      area.innerHTML = SLIDES.map((s, i) => `
        <div class="slide-canvas ${s.type === 'cover' ? 'is-cover' : ''}">
          ${buildSlideHTML(s, i)}
        </div>
      `).join('');
    }

    // PowerPoint (.pptx) 生成＆ダウンロード
    function downloadPPTX() {
      if (typeof PptxGenJS === 'undefined') {
        alert('PowerPoint生成ライブラリの読み込みに失敗しました。インターネット接続を確認してください。');
        return;
      }

      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9'; // 10 x 5.625 inch
      pptx.title = '里山わくわくパーク in Mahora稲穂山';
      pptx.author = '皆野教育シンポジウム 1班';

      const C = {
        bg: 'FDFBF7',
        green: '2E6F40',
        greenLight: 'E8F3EB',
        brown: '8C5A2B',
        orange: 'D97736',
        orangeLight: 'FDF1E6',
        card: 'FFFFFF',
        border: 'D8D2C5',
        text: '2C2C2C',
        sub: '666666'
      };
      const FONT = 'Meiryo';

      SLIDES.forEach((d, idx) => {
        const slide = pptx.addSlide();
        slide.background = { color: C.bg };
        if (d.notes) slide.addNotes(d.notes);

        const pageText = `${idx + 1} / ${SLIDES.length}`;

        if (d.type === 'cover') {
          slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 0.25, h: 5.625, fill: { color: C.green }, line: { type: 'none' } });
          slide.addShape(pptx.ShapeType.roundRect, { x: 0.6, y: 0.55, w: 3.2, h: 0.38, fill: { color: C.green }, line: { type: 'none' } });
          slide.addText(d.badge, { x: 0.6, y: 0.55, w: 3.2, h: 0.38, fontFace: FONT, fontSize: 11, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle' });

          slide.addText(d.title, { x: 0.6, y: 1.15, w: 5.6, h: 1.5, fontFace: FONT, fontSize: 30, bold: true, color: C.green, lineSpacingMultiple: 1.2 });

          slide.addShape(pptx.ShapeType.roundRect, { x: 0.6, y: 2.85, w: 5.4, h: 0.58, fill: { color: C.orangeLight }, line: { color: C.orange, pt: 1.5 } });
          slide.addText(d.subtitle, { x: 0.6, y: 2.85, w: 5.4, h: 0.58, fontFace: FONT, fontSize: 14, bold: true, color: C.brown, align: 'center', valign: 'middle' });

          slide.addText(d.meta, { x: 0.6, y: 3.75, w: 5.5, h: 1.1, fontFace: FONT, fontSize: 12, color: C.sub, lineSpacingMultiple: 1.4 });

          addPptxImageOrBox(slide, pptx, d.imageKey, d.placeholder, 6.45, 0.55, 3.05, 4.45, C, FONT);
          return;
        }

        // 共通ヘッダー
        slide.addText(d.tag, { x: 0.45, y: 0.2, w: 4, h: 0.25, fontFace: FONT, fontSize: 10, bold: true, color: C.orange });
        slide.addText(d.title, { x: 0.45, y: 0.45, w: 9.1, h: 0.5, fontFace: FONT, fontSize: 22, bold: true, color: C.green });
        slide.addShape(pptx.ShapeType.rect, { x: 0.45, y: 1.02, w: 9.1, h: 0.03, fill: { color: C.green }, line: { type: 'none' } });

        // 共通フッター
        slide.addText('皆野教育シンポジウム 1班｜里山わくわくパーク in Mahora稲穂山', { x: 0.45, y: 5.22, w: 7, h: 0.25, fontFace: FONT, fontSize: 9, color: C.sub });
        slide.addText(pageText, { x: 8.5, y: 5.22, w: 1.05, h: 0.25, fontFace: FONT, fontSize: 9, bold: true, color: C.sub, align: 'right' });

        if (d.type === 'twoCard') {
          addPptxCard(slide, pptx, 0.45, 1.25, 4.4, 3.8, d.leftTitle, d.leftBody, C[d.leftColor], C, FONT);
          addPptxCard(slide, pptx, 5.15, 1.25, 4.4, 3.8, d.rightTitle, d.rightBody, C[d.rightColor], C, FONT);
        } else if (d.type === 'imageRight') {
          slide.addShape(pptx.ShapeType.roundRect, { x: 0.45, y: 1.25, w: 5.5, h: 3.8, fill: { color: C.card }, line: { color: C.border, pt: 1 } });
          slide.addText(d.body, { x: 0.65, y: 1.42, w: 5.1, h: 3.45, fontFace: FONT, fontSize: 12, color: C.text, valign: 'top', lineSpacingMultiple: 1.35 });
          addPptxImageOrBox(slide, pptx, d.imageKey, d.placeholder, 6.2, 1.25, 3.35, 3.8, C, FONT);
        } else if (d.type === 'ending') {
          slide.addShape(pptx.ShapeType.roundRect, { x: 0.65, y: 1.3, w: 8.7, h: 1.65, fill: { color: C.card }, line: { color: C.orange, pt: 2 } });
          slide.addText(d.visionTitle, { x: 0.85, y: 1.45, w: 8.3, h: 0.4, fontFace: FONT, fontSize: 16, bold: true, color: C.orange, align: 'center' });
          slide.addText(d.visionBody, { x: 0.85, y: 1.92, w: 8.3, h: 0.9, fontFace: FONT, fontSize: 13, color: C.text, align: 'center', lineSpacingMultiple: 1.35 });

          slide.addShape(pptx.ShapeType.roundRect, { x: 0.65, y: 3.2, w: 8.7, h: 1.05, fill: { color: C.green }, line: { type: 'none' } });
          slide.addText(d.closing, { x: 0.85, y: 3.2, w: 8.3, h: 1.05, fontFace: FONT, fontSize: 15, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle', lineSpacingMultiple: 1.35 });

          slide.addText(d.thanks, { x: 0.65, y: 4.48, w: 8.7, h: 0.5, fontFace: FONT, fontSize: 18, bold: true, color: C.brown, align: 'center' });
        }
      });

      pptx.writeFile({ fileName: '里山わくわくパーク_発表スライド.pptx' });
    }

    function addPptxCard(slide, pptx, x, y, w, h, title, body, accent, C, FONT) {
      slide.addShape(pptx.ShapeType.roundRect, { x, y, w, h, fill: { color: C.card }, line: { color: C.border, pt: 1 } });
      slide.addShape(pptx.ShapeType.roundRect, { x: x + 0.14, y: y + 0.14, w: w - 0.28, h: 0.46, fill: { color: accent }, line: { type: 'none' } });
      slide.addText(title, { x: x + 0.14, y: y + 0.14, w: w - 0.28, h: 0.46, fontFace: FONT, fontSize: 13, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle' });
      slide.addText(body, { x: x + 0.18, y: y + 0.72, w: w - 0.36, h: h - 0.85, fontFace: FONT, fontSize: 12, color: C.text, valign: 'top', lineSpacingMultiple: 1.32 });
    }

    function addPptxImageOrBox(slide, pptx, imageKey, placeholder, x, y, w, h, C, FONT) {
      const src = imageKey ? IMAGES[imageKey] : '';
      if (src) {
        slide.addImage({ path: src, x, y, w, h, sizing: { type: 'contain', w, h } });
      } else {
        slide.addShape(pptx.ShapeType.roundRect, { x, y, w, h, fill: { color: C.greenLight }, line: { color: C.green, pt: 1.5, dashType: 'dash' } });
        slide.addText(placeholder, { x, y, w, h, fontFace: FONT, fontSize: 12, bold: true, color: C.green, align: 'center', valign: 'middle', lineSpacingMultiple: 1.35 });
      }
    }

    // イベント登録
    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentIdx > 0) { currentIdx--; render(); }
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentIdx < SLIDES.length - 1) { currentIdx++; render(); }
    });
    document.getElementById('btnPptx').addEventListener('click', downloadPPTX);
    document.getElementById('btnPdf').addEventListener('click', () => window.print());
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      const el = document.getElementById('deckWrapper');
      if (!document.fullscreenElement) {
        el.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });
    document.getElementById('btnToggleNotes').addEventListener('click', (e) => {
      const panel = document.getElementById('notesPanel');
      panel.classList.toggle('hidden');
      e.target.textContent = panel.classList.contains('hidden') ? '📝 発表原稿を表示' : '📝 発表原稿を隠す';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        if (currentIdx < SLIDES.length - 1) { currentIdx++; render(); }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (currentIdx > 0) { currentIdx--; render(); }
      }
    });

    // 初期描画
    render();
    buildPrintArea();
  </script>
</body>
